name: Setup PixiBoardJS SDK workspace
description: Install the pinned Node, pnpm and frozen workspace dependencies
inputs:
  working-directory:
    description: SDK checkout directory relative to the workspace
    required: false
    default: .
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.25.0
        run_install: false
    - uses: actions/setup-node@v4
      with:
        # Keep the CI runtime pinned without importing a separate release/tooling file.
        node-version: 22.22.0
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
    - shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: ${{ inputs.working-directory }}
