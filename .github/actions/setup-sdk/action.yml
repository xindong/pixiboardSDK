name: Setup PixiBoardJS SDK workspace
description: Install pinned Node, pnpm, and frozen workspace dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.25.0
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22.22.0
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - shell: bash
      run: pnpm install --frozen-lockfile
