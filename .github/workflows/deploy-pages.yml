name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/pixiboardjs/**
      - packages/core/**
      - packages/renderer-pixi/**
      - packages/capabilities/**
      - packages/adapter-browser/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: pnpm --filter pixiboardjs build
      - run: pnpm --filter pixiboardjs-site build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
