name: CI gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  static-boundaries:
    name: Static boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: pnpm docs:check
      - run: pnpm packages:check
      - run: node scripts/check-current-document-only.mjs
      - run: pnpm test:browser-boundary

  core-contracts:
    name: Core and integration contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-core-gate.mjs

  browser-chromium:
    name: Browser required Chromium contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIXIBOARD_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: pnpm --filter @pixi-board/core build
      - run: pnpm --filter pixiboardjs build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config tests/browser/playwright.config.ts --grep-invert "media-heavy"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-traces-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore

  performance-regression:
    name: Performance regression (fail-closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: .benchmark-baseline
      - uses: ./.github/actions/setup-sdk
      - name: Install baseline dependencies
        run: pnpm --dir .benchmark-baseline install --frozen-lockfile
      - name: Measure baseline
        working-directory: .benchmark-baseline
        env:
          PIXIBOARD_PERFORMANCE_DIR: .artifacts/performance/pr
        run: node scripts/check-performance-gate.mjs pr
      - name: Measure candidate
        env:
          PIXIBOARD_PERFORMANCE_DIR: .artifacts/performance/pr
        run: node scripts/check-performance-gate.mjs pr
      - name: Compare baseline and candidate
        run: |
          node apps/benchmark/src/check-regression.mjs \
            --baseline .benchmark-baseline/.artifacts/performance/pr/node.json \
            --candidate .artifacts/performance/pr/node.json \
            --tolerance 0.5 \
            | tee .artifacts/performance/pr/regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-pr-${{ github.run_id }}
          path: |
            .benchmark-baseline/.artifacts/performance/pr/
            .artifacts/performance/pr/
          if-no-files-found: error

  desktop-tauri-gate:
    name: Desktop Tauri gate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS launch smoke
          - os: windows-2022
            label: Windows native config/build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PIXIBOARD_DESKTOP_PLATFORM: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/examples-desktop-sdk/src-tauri
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-desktop-platform-gate.mjs --mode tauri
