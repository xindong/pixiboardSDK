name: CI gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  static-boundaries:
    name: Static boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: pnpm docs:check
      - run: pnpm packages:check
      - run: node scripts/check-current-document-only.mjs
      - run: pnpm test:browser-boundary

  core-contracts:
    name: Core and integration contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-core-gate.mjs

  browser-chromium:
    name: Browser required Chromium contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIXIBOARD_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: pnpm --filter pixiboardjs build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config tests/browser/playwright.config.ts --grep-invert "media-heavy"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-traces-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
