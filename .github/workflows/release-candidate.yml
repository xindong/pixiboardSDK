name: Release candidate final gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SDK commit SHA that already passed required CI checks
        required: true
        type: string

permissions:
  contents: read
  checks: read

env:
  CI: "true"

jobs:
  verify-candidate:
    name: Verify candidate commit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = "${{ inputs.candidate_sha }}";
            if (!/^[0-9a-f]{40}$/i.test(sha)) core.setFailed("candidate_sha must be a full 40-character commit SHA");
            const { data } = await github.rest.checks.listForRef({ owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100 });
            const required = ["Core contracts", "Browser required Chromium", "Performance regression (fail-closed)"];
            const latest = [...data.check_runs].sort((a, b) => new Date(b.completed_at ?? b.started_at ?? 0) - new Date(a.completed_at ?? a.started_at ?? 0));
            for (const name of required) {
              const run = latest.find(item => item.name === name);
              if (run?.conclusion !== "success") core.setFailed(`${name} is ${run?.conclusion ?? "missing"} for ${sha}`);
            }

  release-artifact:
    name: Pack, API, bundle and external consumers
    needs: verify-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PIXIBOARD_RELEASE_ARTIFACT_DIR: .artifacts/release
      PIXIBOARD_BUNDLE_REPORT: .artifacts/release/bundle-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/setup-sdk
      - run: pnpm release:check
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pixiboard-public-packages-rc-${{ inputs.candidate_sha }}
          path: |
            .artifacts/release/*
            packages/core/etc/core.api.md
            packages/renderer-pixi/etc/renderer-pixi.api.md
            packages/pixiboardjs/etc/pixiboardjs.api.md
          if-no-files-found: error

  browser-candidate:
    name: Browser consumes candidate commit
    needs: verify-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIXIBOARD_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/setup-sdk
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/run-browser-contract.mjs

  performance-candidate:
    name: Fixed-runner performance, soak and Konva evidence
    needs: verify-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/check-performance-gate.mjs rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-rc-${{ inputs.candidate_sha }}
          path: .artifacts/performance/rc.json
          if-no-files-found: error

  desktop-candidate:
    name: Repository desktop candidate (${{ matrix.label }})
    needs: [verify-candidate, release-artifact]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS launch smoke
          - os: windows-2022
            label: Windows native config/build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PIXIBOARD_DESKTOP_PLATFORM: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-desktop-platform-gate.mjs --mode tauri

  final-gate:
    name: Release candidate accepted
    if: always()
    needs: [release-artifact, browser-candidate, performance-candidate, desktop-candidate]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        run: |
          test "${{ needs.release-artifact.result }}" = success
          test "${{ needs.browser-candidate.result }}" = success
          test "${{ needs.performance-candidate.result }}" = success
          test "${{ needs.desktop-candidate.result }}" = success
