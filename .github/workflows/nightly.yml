name: Nightly gates

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  contracts-and-integrations:
    name: Core, Plugin, Agent and MCP contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-core-gate.mjs

  chromium-media:
    name: Required Chromium browser contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PIXIBOARD_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: pnpm --filter pixiboardjs build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config tests/browser/playwright.config.ts --grep-invert "media-heavy"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-chromium-traces-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore

  performance-and-konva:
    name: Core, Chromium WebGL and Konva benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/check-performance-gate.mjs nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-nightly-${{ github.run_id }}
          path: .artifacts/performance/nightly/
          if-no-files-found: error

  desktop-tauri-platforms:
    name: Desktop Tauri gate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS launch smoke
          - os: windows-2022
            label: Windows native config/build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PIXIBOARD_DESKTOP_PLATFORM: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/examples-desktop-sdk/src-tauri
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-desktop-platform-gate.mjs --mode tauri
