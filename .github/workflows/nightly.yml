name: Nightly gates

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  contracts-and-integrations:
    name: Core, Plugin, Agent and MCP contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-core-gate.mjs

  chromium-full:
    name: Chromium WebGL E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIXIBOARD_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/run-browser-contract.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-chromium-traces-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore

  renderer-performance-and-soak:
    name: Instrumented 10k/50k/100k performance and destroy soak
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/check-performance-gate.mjs nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-nightly-${{ github.run_id }}
          path: .artifacts/performance/nightly.json
          if-no-files-found: error

  desktop-tauri-platforms:
    name: Desktop Tauri gate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS launch smoke
          - os: windows-2022
            label: Windows native config/build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PIXIBOARD_DESKTOP_PLATFORM: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-desktop-platform-gate.mjs --mode tauri
