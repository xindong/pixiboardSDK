name: Desktop launch smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/adapter-tauri/**"
      - "apps/examples-desktop-sdk/src/**"
      - "apps/examples-desktop-sdk/src-tauri/**"
      - "apps/examples-desktop-sdk/smoke/**"
      - ".github/workflows/desktop-launch-smoke.yml"

jobs:
  tauri-launch-smoke:
    name: Repository Tauri gate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS launch smoke
          - os: windows-2022
            label: Windows native config/build
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      PIXIBOARD_DESKTOP_PLATFORM: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-sdk
      - run: node scripts/run-desktop-platform-gate.mjs --mode tauri
